name: asador
description: Control remoto Bluetooth (Clásico SPP + BLE) para asador rotativo con ESP32.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado (Notifier / NotifierProvider). MIT.
  flutter_riverpod: ^3.0.0

  # BLE multiplataforma Android + iOS. Licencia BSD-3 (uso comercial libre).
  # Se evita flutter_blue_plus: desde 2025 exige licencia comercial de pago
  # para cualquier empresa con ánimo de lucro.
  universal_ble: ^2.3.0

  # Persistencia de la configuración del protocolo y del último dispositivo.
  shared_preferences: ^2.3.0

  # iOS: abrir Ajustes de la app ("app-settings:"), única vía permitida por Apple.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
